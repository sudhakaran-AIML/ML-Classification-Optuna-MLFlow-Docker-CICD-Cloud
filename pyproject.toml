[project]
name = "ml-classification-optuna-mlflow-docker-cicd-cloud"
version = "0.1.0"
description = "Iris flower classification with XGBoost, Optuna, MLFlow, and Gradio UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "optuna>=3.4.0",
    "mlflow>=2.9.0",
    "gradio>=4.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "dvc>=3.0.0",
]
