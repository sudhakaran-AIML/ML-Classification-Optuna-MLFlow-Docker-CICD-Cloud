version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  simple:
    format: "%(levelname)s - %(message)s"
  
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(pathname)s:%(lineno)d - %(funcName)s() - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file_training:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/training.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8
  
  file_inference:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/inference.log
    maxBytes: 5242880  # 5MB
    backupCount: 3
    encoding: utf8
  
  file_error:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  src:
    level: DEBUG
    handlers: [console, file_training, file_error]
    propagate: false
  
  app:
    level: INFO
    handlers: [console, file_inference, file_error]
    propagate: false
  
  train:
    level: DEBUG
    handlers: [console, file_training, file_error]
    propagate: false

root:
  level: INFO
  handlers: [console, file_training, file_error]
